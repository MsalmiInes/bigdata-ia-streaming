# ======================================================================
# Projet Big Data + IA : plateforme de streaming
# Demarrage PAR GROUPES (profiles) pour tenir dans 8 Go de RAM :
#   (sans profil) : mysql, hdfs, yarn, tools        -> docker compose up -d
#   kafka         : kafka                           -> docker compose up -d kafka
#   hive          : postgres, metastore, hiveserver2-> docker compose up -d hiveserver2
#   spark         : master, worker, jupyter         -> docker compose up -d jupyter spark-worker
# ======================================================================
name: bigdata-ia

x-tools: &tools
  build: ./docker/tools
  image: bigdata-tools:1.0
  restart: on-failure:5
  networks: [bigdata]

x-hadoop-env: &hadoop-env
  HADOOP_HEAPSIZE_MAX: 512m
  HADOOP_OPTS: -Djava.net.preferIPv4Stack=true

services:
  # ------------------------------------------------------------ SOURCE
  mysql:
    image: mysql:8.0
    hostname: mysql
    restart: on-failure:5
    networks: [bigdata]
    command:
      - --default-authentication-plugin=mysql_native_password
      - --secure-file-priv=/var/lib/mysql-files
      - --character-set-server=utf8mb4
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data/generated/${DATASET:-small}:/csv:ro
      - ./docker/mysql/01-load.sh:/docker-entrypoint-initdb.d/01-load.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ------------------------------------------------------------ HDFS
  namenode:
    <<: *tools
    hostname: namenode
    environment: *hadoop-env
    command:
      - bash
      - -c
      - "[ -f /hadoop/dfs/name/current/VERSION ] || hdfs namenode -format -nonInteractive -force; exec hdfs namenode"
    ports: ["127.0.0.1:9870:9870"]
    volumes:
      - ./config/hadoop:/etc/hadoop-conf:ro
      - nn-data:/hadoop/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  datanode:
    <<: *tools
    hostname: datanode
    environment: *hadoop-env
    command: ["hdfs", "datanode"]
    depends_on:
      namenode: { condition: service_healthy }
    volumes:
      - ./config/hadoop:/etc/hadoop-conf:ro
      - dn-data:/hadoop/dfs/data

  # ------------------------------------------------------------ YARN
  resourcemanager:
    <<: *tools
    hostname: resourcemanager
    environment: *hadoop-env
    command: ["yarn", "resourcemanager"]
    depends_on:
      namenode: { condition: service_healthy }
    ports: ["127.0.0.1:8088:8088"]
    volumes:
      - ./config/hadoop:/etc/hadoop-conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/ws/v1/cluster/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  nodemanager:
    <<: *tools
    hostname: nodemanager
    environment: *hadoop-env
    command: ["yarn", "nodemanager"]
    depends_on:
      resourcemanager: { condition: service_healthy }
    ports: ["127.0.0.1:8042:8042"]
    volumes:
      - ./config/hadoop:/etc/hadoop-conf:ro
      - nm-data:/hadoop/yarn

  # ------------------------------------------------------------ OUTILS (Pig, Sqoop, Flume, client Hadoop)
  tools:
    <<: *tools
    hostname: tools
    working_dir: /work
    command: ["sleep", "infinity"]
    depends_on:
      namenode: { condition: service_healthy }
      mysql: { condition: service_healthy }
    volumes:
      - ./config/hadoop:/etc/hadoop-conf:ro
      - ./:/work

  # ------------------------------------------------------------ KAFKA (KRaft, sans Zookeeper)
  kafka:
    image: apache/kafka:3.9.0
    profiles: [kafka]
    hostname: kafka
    restart: on-failure:5
    networks: [bigdata]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ------------------------------------------------------------ HIVE
  postgres:
    image: postgres:16-alpine
    profiles: [hive]
    hostname: postgres
    restart: on-failure:5
    networks: [bigdata]
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepass
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 10s
      timeout: 5s
      retries: 20

  hive-metastore:
    build: ./docker/hive
    image: bigdata-hive:1.0
    profiles: [hive]
    hostname: hive-metastore
    restart: on-failure:5
    networks: [bigdata]
    depends_on:
      postgres: { condition: service_healthy }
      namenode: { condition: service_healthy }
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepass
        -Dmetastore.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse
        -Dhive.metastore.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse
    volumes:
      - ./config/hive:/hive_custom_conf:ro

  hiveserver2:
    build: ./docker/hive
    image: bigdata-hive:1.0
    profiles: [hive]
    hostname: hiveserver2
    restart: on-failure:5
    networks: [bigdata]
    depends_on:
      hive-metastore: { condition: service_started }
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10002:10002"
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
        -Dhive.metastore.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse
    volumes:
      - ./config/hive:/hive_custom_conf:ro

  # ------------------------------------------------------------ SPARK + JUPYTER
  spark-master:
    build: ./docker/spark
    image: bigdata-spark:1.0
    profiles: [spark]
    hostname: spark-master
    restart: on-failure:5
    networks: [bigdata]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports: ["127.0.0.1:8080:8080"]

  spark-worker:
    build: ./docker/spark
    image: bigdata-spark:1.0
    profiles: [spark]
    hostname: spark-worker
    restart: on-failure:5
    networks: [bigdata]
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "1536m", "--webui-port", "8081",
              "spark://spark-master:7077"]
    ports: ["127.0.0.1:8081:8081"]

  jupyter:
    build: ./docker/spark
    image: bigdata-spark:1.0
    profiles: [spark]
    hostname: jupyter
    user: "0"
    restart: on-failure:5
    networks: [bigdata]
    depends_on: [spark-master]
    working_dir: /workspace
    environment:
      HOME: /root
      HADOOP_USER_NAME: root
      PYTHONPATH: /opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root",
              "--ServerApp.token=", "--ServerApp.password=", "--notebook-dir=/workspace"]
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    volumes:
      - ./spark:/workspace
      - ./data:/data:ro
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

networks:
  bigdata:
    name: bigdata-net

volumes:
  mysql-data:
  nn-data:
  dn-data:
  nm-data:
  kafka-data:
  pg-data:
